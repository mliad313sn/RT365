# Control plane: ingress from edge, analytics (intent queue only) and execution (events); egress to execution (order commands), vault (signing keys), audit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: control-default-deny, namespace: control}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: control-allow, namespace: control}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {plane: edge}}
        - namespaceSelector: {matchLabels: {plane: control}}
        - namespaceSelector: {matchLabels: {plane: execution}}
    - from:
        - namespaceSelector: {matchLabels: {plane: analytics}}
      ports: [{protocol: TCP, port: 8443}]   # intent-queue only
  egress:
    - to:
        - namespaceSelector: {matchLabels: {plane: control}}
        - namespaceSelector: {matchLabels: {plane: execution}}
        - namespaceSelector: {matchLabels: {plane: analytics}}   # revocation, events
    - to:
        - namespaceSelector: {matchLabels: {plane: security}}
          podSelector: {matchLabels: {app: vault}}
      ports: [{protocol: TCP, port: 8200}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}]
