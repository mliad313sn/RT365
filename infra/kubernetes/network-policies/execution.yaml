# Execution plane: the only plane with a broker route (egress to broker CIDRs via the egress gateway) and vault broker-credential access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: execution-default-deny, namespace: execution}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: execution-allow, namespace: execution}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {plane: control}}
        - namespaceSelector: {matchLabels: {plane: execution}}
    - from:
        - namespaceSelector: {matchLabels: {plane: edge}}
      ports: [{protocol: TCP, port: 8444}]   # read-only order/position queries
  egress:
    - to:
        - namespaceSelector: {matchLabels: {plane: execution}}
        - namespaceSelector: {matchLabels: {plane: control}}   # events, audit
    - to:
        - namespaceSelector: {matchLabels: {plane: security}}
          podSelector: {matchLabels: {app: vault}}
      ports: [{protocol: TCP, port: 8200}]
    - to:
        # Broker endpoints ONLY: one ipBlock per certified adapter, filled from BROKER_CERTIFICATIONS at deployment.
        # 203.0.113.0/24 is the RFC 5737 documentation range used as the sim placeholder; 0.0.0.0/0 is refused by the checker (review F-12).
        - ipBlock: {cidr: 203.0.113.0/24}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}]
