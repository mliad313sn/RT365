# Vault/KMS: ingress only from control (signing) and execution (broker credentials). Analytics/MCP never reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: vault-ingress, namespace: security}
spec:
  podSelector: {matchLabels: {app: vault}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {plane: control}}
        - namespaceSelector: {matchLabels: {plane: execution}}
      ports: [{protocol: TCP, port: 8200}]
