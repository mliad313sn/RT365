# Analytics plane: default deny; egress only to the Control-plane intent queue (and DNS). No route to execution, brokers or vault.
# MCP server pods are EXCLUDED from the namespace-wide egress rule (NetworkPolicies are additive): their egress is
# defined exclusively in mcp-servers.yaml (review F-19).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: analytics-default-deny, namespace: analytics}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: analytics-allow-intent-queue, namespace: analytics}
spec:
  podSelector:
    matchExpressions: [{key: component, operator: NotIn, values: [mcp-server]}]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {plane: control}}
          podSelector: {matchLabels: {app: intent-queue}}
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - namespaceSelector: {matchLabels: {plane: analytics}}
          podSelector: {matchExpressions: [{key: app, operator: In, values: [market-data, instrument-master, strategy, backtest, feature-signal]}]}
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: analytics-allow-ingress, namespace: analytics}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {plane: edge}}
      ports: [{protocol: TCP, port: 8443}]
    - from:
        - namespaceSelector: {matchLabels: {plane: analytics}}
      ports: [{protocol: TCP, port: 8443}]
    - from:
        - namespaceSelector: {matchLabels: {plane: control}}   # revocation / events push
      ports: [{protocol: TCP, port: 8444}]
