# Analytics plane: default deny; egress only to the Control-plane intent queue (and DNS). No route to execution, brokers or vault.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: analytics-default-deny, namespace: analytics}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: analytics-allow-intent-queue, namespace: analytics}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {plane: control}}
          podSelector: {matchLabels: {app: intent-queue}}
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - namespaceSelector: {matchLabels: {plane: analytics}}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: analytics-allow-ingress-edge, namespace: analytics}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {plane: edge}}
        - namespaceSelector: {matchLabels: {plane: analytics}}
        - namespaceSelector: {matchLabels: {plane: control}}   # revocation / events
