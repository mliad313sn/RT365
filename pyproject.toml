[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rt365-robotrader"
version = "0.1.0"
description = "Global AI-MCP RoboTrader - deterministic control envelope for AI-assisted trading (dev/sim environment)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "jsonschema>=4.20",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.90", "ruff>=0.4", "mypy>=1.8", "types-PyYAML"]
build = ["build>=1.0", "pyinstaller>=6.0"]

[project.scripts]
rt365 = "rt365_cli.main:main"

# Repository structure target [Source: 16]: one package per bounded context, mapped to
# the blueprint directory layout. Protected paths (services/risk, services/compliance,
# services/execution, mcp/policies, security, contracts) require 2nd-line CODEOWNERS approval.
[tool.setuptools.package-dir]
rtcore = "libs/core/rtcore"
market_data = "services/market-data/market_data"
strategy_service = "services/strategy/strategy_service"
backtest_engine = "services/backtest/backtest_engine"
portfolio_service = "services/portfolio/portfolio_service"
risk_engine = "services/risk/risk_engine"
compliance_engine = "services/compliance/compliance_engine"
approval_service = "services/approval/approval_service"
oms = "services/oms/oms"
execution_gateway = "services/execution/execution_gateway"
reconciliation_service = "services/reconciliation/reconciliation_service"
audit_service = "services/audit/audit_service"
killswitch_service = "services/killswitch/killswitch_service"
identity_service = "services/identity/identity_service"
mcp_servers = "mcp/servers/mcp_servers"
broker_adapters = "connectors/brokers/broker_adapters"
data_providers = "connectors/data-providers/data_providers"
rtobs = "observability/rtobs"
web_bff = "apps/web/web_bff"
rt365_cli = "apps/cli/rt365_cli"

[tool.setuptools]
packages = [
  "rtcore", "rtcore.schemas", "market_data", "strategy_service", "backtest_engine", "portfolio_service",
  "risk_engine", "compliance_engine", "approval_service", "oms", "execution_gateway",
  "reconciliation_service", "audit_service", "killswitch_service", "identity_service",
  "mcp_servers", "broker_adapters", "data_providers", "rtobs", "web_bff", "rt365_cli",
]

# The resource bundle (mcp/policies, observability catalogues, risk policy, dashboard assets) is staged into
# apps/cli/rt365_cli/_bundle by scripts/build_package.sh before `python -m build`; it is git-ignored.
[tool.setuptools.package-data]
rt365_cli = ["_bundle/**/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = [
  "libs/core", "services/market-data", "services/strategy", "services/backtest", "services/portfolio",
  "services/risk", "services/compliance", "services/approval", "services/oms", "services/execution",
  "services/reconciliation", "services/audit", "services/killswitch", "services/identity",
  "mcp/servers", "connectors/brokers", "connectors/data-providers", "observability", "apps/web", "apps/cli", "test",
]
markers = [
  "tc(id): control-quartet test case ID from docs/TEST_CASES (e.g. TC-RK-001)",
  "env(tag): lowest environment-ladder tag in which the test must pass (dev|sim|shadow|paper|pilot)",
  "quartet(kind): positive|negative|abuse|recovery",
  "req(id): requirement ID (FR-xx / NFR-xx) the test evidences",
]
addopts = "-p evidence_plugin -q"
filterwarnings = ["error::DeprecationWarning:rtcore.*"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["docs", "goals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["N818", "E501", "B008", "B023", "UP042"]

[tool.mypy]
python_version = "3.11"
mypy_path = "libs/core:services/market-data:services/strategy:services/backtest:services/portfolio:services/risk:services/compliance:services/approval:services/oms:services/execution:services/reconciliation:services/audit:services/killswitch:services/identity:mcp/servers:connectors/brokers:connectors/data-providers:observability:apps/web:apps/cli"
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["^test/", "^scripts/"]
